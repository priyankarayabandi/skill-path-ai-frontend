<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillPath AI — Student Skill &amp; Career Roadmap Platform</title>
  <meta name="description"
    content="SkillPath AI bridges the academia-industry gap. Assess current competencies, generate personalized weekly learning milestones, and follow step-by-step career tracks." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

  <!-- SkillPath AI Stylesheet -->
  <link rel="stylesheet" href="/skillpath-src/src/css/styles.css" />
</head>

<body>
  <div id="skillpath-root"></div>

  <!--
      Scripts load in dependency order:
      1. api.js          — window.SkillPathAPI, window.SkillPathEvents
      2. components.js   — window.SkillPathUI  (depends on SkillPathEvents)
      3. views-student.js — window.SkillPathStudentViews
      4. views-admin.js   — window.SkillPathAdminViews
      5. app.js           — orchestrator (uses all globals above)
    -->
  <script src="/skillpath-src/src/js/api.js"></script>
  <script src="/skillpath-src/src/js/components.js"></script>
  <script src="/skillpath-src/src/js/views-student.js"></script>
  <script src="/skillpath-src/src/js/views-admin.js"></script>
  <script src="/skillpath-src/src/js/app.js"></script>
</body>

</html>
